<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090e12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="img/station.jpg">
<title>טיפה במדבר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a film frame leads every screen (scene still or clip with a lower-third title); a slim instrument bar on top; puzzle and lock sit side by side under the frame. */
:root{
  color-scheme:dark;
  --ink:#090e12; --panel:#10181e; --panel2:#17232b; --hair:#26353e; --edge:#62808f;
  --text:#eaf0f0; --dim:#a3b4ba; --amber:#e8a548; --amber-ink:#1a1206; --teal:#74d3de;
  --bad:#ff9f8c; --ok:#a4e6ab;
  --sans:"IBM Plex Sans Hebrew",Arial,Helvetica,sans-serif;
  --display:"Karantina","IBM Plex Sans Hebrew",Arial,sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans Hebrew",Arial,monospace;
}
*{box-sizing:border-box}
html{font-size:100%;background:#090e12}
html.big{font-size:118%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:1.125rem;line-height:1.65;font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{font-family:var(--sans);margin:0;text-wrap:balance;line-height:1.12}
h1{font-family:var(--display);font-size:clamp(4.4rem,16vw,9.5rem);font-weight:700;letter-spacing:.01em;line-height:.88}
h2{font-family:var(--display);font-size:clamp(2.8rem,8vw,4.6rem);font-weight:700;letter-spacing:.01em;line-height:.95}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--ink)}
[tabindex="-1"]:focus:not(:focus-visible){outline:none;box-shadow:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn,.key,.pcard,.tok,.ib{transition:transform .08s ease,filter .12s ease,border-color .12s ease,background-color .12s ease}
.btn:active,.key:active,.pcard:active,.tok:active,.ib:active{transform:scale(.96)}
.wh,.spz,.part,.hot span{transition:filter .1s ease,box-shadow .12s ease,background-color .12s ease}
.wh:active,.spz:active,.part:active{filter:brightness(1.35)}
body{opacity:0;transition:opacity .4s ease}body.ready{opacity:1}
.wrap{max-width:70rem;margin:0 auto}
#app>section{display:flex;flex-direction:column;gap:1.5rem}
.label{font-family:var(--sans);font-size:.9rem;font-weight:600;letter-spacing:.03em;line-height:1.4;color:var(--teal)}
.label::before{content:"";display:inline-block;width:.5em;height:.5em;background:currentColor;margin-inline-end:.5em;vertical-align:.08em}
.dim{color:var(--dim)}

/* instrument bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(9,14,18,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:.5rem;min-height:56px;border-bottom:1px solid var(--hair);margin-bottom:1.25rem}
.brand{font-weight:800;letter-spacing:.04em;margin-inline-end:auto;white-space:nowrap}
.brand i{font-style:normal;color:var(--amber)}
.timer{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;padding:.2rem .6rem;border:1px solid var(--edge);border-radius:4px;direction:ltr}
.timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.timer.late{color:var(--bad)} .timer.late::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.ib{flex:none;width:44px;height:44px;display:inline-grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--dim)}
.ib:hover{color:var(--text);border-color:var(--hair)}
.ib[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.pausebtn{position:absolute;z-index:4;top:.35rem;inset-inline-end:.35rem;background:rgba(9,14,18,.45);color:#fff;border-color:transparent}
.pausebtn svg{width:16px;height:16px}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tline{position:absolute;inset:auto 0 -1px 0;height:2px;background:transparent;direction:ltr}
.tline b{display:block;height:100%;background:var(--amber);transition:width 1s linear}

/* film frame */
.frame{position:relative}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:6px;background:#000;border:1px solid var(--hair)}
.stage img,.stage video,.stage svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,14,18,.35) 0%,rgba(9,14,18,0) 22%,rgba(9,14,18,0) 52%,rgba(9,14,18,.82) 100%)}
.third{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
@media (min-width:1100px){
  .third .label{color:#fff;background:rgba(9,14,18,.66);padding:.2rem .6rem;border-radius:3px;align-self:flex-start}
  .third{position:absolute;z-index:2;inset:auto 0 0 0;margin:0;padding:1.75rem 2rem;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.7)}
  .cover .third{padding:2.5rem 2.5rem 2.75rem;gap:.7rem}
}
.cover .sub{font-size:clamp(1.05rem,2vw,1.3rem);max-width:38rem;font-weight:300}
.hot{position:absolute;z-index:3;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;padding:0}
.hot span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;font-weight:600;
  background:rgba(9,14,18,.78);color:#fff;border:1.5px solid #fff;box-shadow:0 0 0 0 rgba(232,165,72,.8);animation:ping 2.4s infinite}
.hot.seen span{border-color:var(--amber);color:var(--amber);border-style:double;border-width:4px;animation:none}
.hot[aria-pressed="true"] span{background:var(--teal);color:var(--ink);border-color:var(--teal);border-style:solid;border-width:1.5px;animation:none}
.hot{border-radius:50%}
.hot:focus-visible{outline:3px solid #fff;outline-offset:0;box-shadow:0 0 0 8px var(--ink)}
.hot:focus-visible span{animation:none}
@keyframes ping{70%{box-shadow:0 0 0 13px rgba(232,165,72,0)}100%{box-shadow:0 0 0 0 rgba(232,165,72,0)}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:6px;padding:1.25rem 1.35rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.panel.gold{border-color:var(--amber)}
.cols{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}
.stack{display:flex;flex-direction:column;gap:1.25rem;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.lead{font-size:1.15rem;font-weight:300;max-width:46rem}
.note{display:grid;gap:0;background:var(--panel2);border:1px solid var(--hair);border-inline-start:3px solid var(--teal);border-radius:6px;overflow:hidden}
.note .tx{padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.note img{display:block;width:100%;height:100%;max-height:15rem;object-fit:cover}
@media (min-width:700px){.note.pic{grid-template-columns:minmax(0,17rem) minmax(0,1fr)}}
.btn{background:var(--amber);color:var(--amber-ink);border:1px solid var(--amber);border-radius:4px;padding:.7rem 1.5rem;font-weight:700;font-size:1.02rem;min-height:48px;letter-spacing:.01em}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--edge)}
.btn.small{padding:.35rem .9rem;font-size:.95rem;min-height:44px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin:0}
.specs div{background:var(--panel);padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.specs dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;color:var(--dim)}
.specs dd{margin:0;font-weight:500}
.specs .big{font-family:var(--mono);font-size:1.9rem;font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums;direction:ltr;text-align:end}
.list{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.45rem}
.list li::marker{color:var(--amber);font-family:var(--mono)}
.live{display:inline-flex;align-items:center;gap:.5rem}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff5a4d;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.slots{display:inline-flex;gap:.35rem;vertical-align:middle}
.tile{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:4px;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:1.15rem}
.tile.empty{background:transparent;border:1px dashed var(--edge);color:var(--dim);font-weight:400}
.won{animation:won .9s ease}
.won .tile{animation:flip .8s .25s ease both}
@keyframes won{0%{box-shadow:0 0 0 0 rgba(232,165,72,.9)}100%{box-shadow:0 0 0 26px rgba(232,165,72,0)}}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.6)}100%{transform:none}}
.late{border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:.55rem .9rem;font-weight:500}
.fb{font-weight:500;min-height:1.6em} .fb.bad{color:var(--bad)} .fb.ok{color:var(--ok)}
.fig{background:#060a0d;border:1px solid var(--hair);border-radius:6px;padding:0;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:27rem;width:100%;margin-inline:auto}
.fig svg{display:block;width:100%;height:auto}
.fig.wide{max-width:34rem}
.face{border-radius:6px;overflow:hidden;border:1px solid var(--hair);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:23rem;width:100%;margin-inline:auto}
.face svg{display:block;width:100%;height:auto}
.dialpad{display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;max-width:23rem;width:100%;margin-inline:auto}
.dialpad .dial{gap:.3rem}
.dialpad .dial button{width:3.4rem;height:44px}
.thumb{width:8.5rem;height:auto;aspect-ratio:3/2;object-fit:cover;flex:none;border-radius:4px;border:1px solid var(--hair)}
@media (max-width:480px){.thumb{width:4.6rem}}

/* locks */
.dials{display:flex;gap:.8rem;justify-content:center;direction:ltr}
.dial{display:flex;flex-direction:column;align-items:center;gap:.35rem}
.dial output{display:grid;place-items:center;width:3.6rem;height:4.4rem;border-radius:4px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#05080a 0%,#1a252c 50%,#05080a 100%);font-family:var(--mono);font-size:2.4rem;font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums}
.dial button{width:3.6rem;height:44px;border-radius:4px;border:1px solid var(--edge);background:var(--panel2);font-size:.9rem}
.dial button:hover,.key:hover,.mv button:hover{border-color:#fff}
.dial small{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--dim)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.steps li{display:flex;align-items:center;gap:.8rem;background:var(--panel2);border:1px solid var(--hair);border-radius:4px;padding:.55rem .75rem}
.steps li p{flex:1;min-width:0}
.mv{display:flex;flex-direction:column;gap:.3rem}
.mv button{width:44px;height:44px;border-radius:4px;border:1px solid var(--edge);background:var(--panel);font-size:.8rem}
.mv button:disabled{opacity:1;color:#8496a0;border-color:var(--hair);cursor:default}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;white-space:nowrap;font-size:.95rem}
.badge svg{width:1.5rem;height:1.5rem;flex:none}
.keys{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.key{min-width:4.8rem;min-height:48px;border-radius:4px;border:1px solid var(--edge);background:var(--panel2);padding:.3rem .7rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:500}
.key svg{width:1.6rem;height:1.6rem}
.key.letter{min-width:52px;font-size:1.5rem;font-weight:800;background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.seq{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;min-height:3.2rem;align-items:center}
.slot{position:relative;display:inline-grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:4px;border:1px dashed var(--edge);font-size:1.5rem;font-weight:800;background:#060a0d}
.slot.full{border-style:solid;border-color:var(--amber)}
.slot svg{width:1.9rem;height:1.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.match{display:grid;gap:.8rem}
.match label{display:grid;gap:.3rem;font-weight:500;min-width:0}
select{font:inherit;min-height:48px;border-radius:4px;border:1px solid var(--edge);background:var(--panel2);color:var(--text);padding:.3rem .6rem;max-width:100%;width:100%;min-width:0}
.hints{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.35rem}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(4,7,9,.86);display:grid;place-items:center;z-index:20;padding:16px}
.overlay .panel{max-width:27rem}
.chapter{position:fixed;inset:0;z-index:15;background:#000;display:grid;place-items:end start;padding:clamp(24px,7vw,96px);pointer-events:none;overflow:hidden;animation:chapter 2.4s ease forwards}
.chapter i{position:absolute;inset:0;background-size:cover;background-position:center;animation:push 2.6s ease-out forwards}
.chapter::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,9,.25),rgba(4,7,9,.1) 40%,rgba(4,7,9,.88))}
.chapter h2{font-size:clamp(4.4rem,15vw,10rem);text-shadow:0 4px 30px rgba(0,0,0,.8)}
.chapter .label{color:#fff;font-size:1rem}
@keyframes push{0%{transform:scale(1.14)}100%{transform:scale(1)}}
.chapter div{position:relative;z-index:1;display:flex;flex-direction:column;gap:.8rem}
@keyframes chapter{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
@media (max-width:620px){.steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"th bd mv" "tx tx mv";gap:.4rem .6rem;padding:.55rem}
  .thumb{grid-area:th;width:4.6rem}.steps .badge{grid-area:bd}.steps li p{grid-area:tx}.steps .mv{grid-area:mv}}
html.big .steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"th bd mv" "tx tx mv";gap:.4rem .6rem}
html.big .thumb{grid-area:th}html.big .steps .badge{grid-area:bd}html.big .steps li p{grid-area:tx}html.big .steps .mv{grid-area:mv}
.bar{flex-wrap:wrap;row-gap:0}
/* rooms: stacked on phones; one full-screen scene with an explore view and a solve view on wide screens */
#app>section.room{gap:1.1rem}
.scenebox{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:6px;border:1px solid var(--hair);background:#000}
.world{position:absolute;inset:0}
.world video,.world img,.world svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hud{display:flex;flex-direction:column;gap:.6rem}
.tobench,.benchbar{display:none}
.bench{display:flex;flex-direction:column;gap:1rem}
.pausebtn{border-radius:50%}
@media (min-width:1000px) and (min-height:620px){
  #app>section.room{display:block;position:relative;width:100vw;margin-inline-start:calc(50% - 50vw);height:calc(100dvh - 57px);margin-top:-1.25rem;margin-bottom:-4rem;overflow:hidden}
  .room .scenebox{position:absolute;inset:0;aspect-ratio:auto;border:0;border-radius:0}
  .room .scenebox::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,14,18,.25) 0%,rgba(9,14,18,0) 25%,rgba(9,14,18,.15) 50%,rgba(9,14,18,.9) 100%)}
  .room .world{inset:auto;top:50%;left:50%;width:max(100vw,calc((100dvh - 57px) * 16 / 9));aspect-ratio:16/9;transform:translate(-50%,-50%);transition:filter .5s ease,transform .9s ease}
  .room.solving .world{filter:blur(8px) brightness(.38);transform:translate(-50%,-50%) scale(1.07)}
  .room.solving .hot,.room.solving .hud,.room.solving .notebox,.room.solving .pausebtn{display:none}
  .room .hud{position:absolute;z-index:2;inset:auto 0 0 0;padding:1.5rem max(24px,calc(50vw - 35rem)) 2rem;gap:.55rem;text-shadow:0 2px 16px rgba(0,0,0,.8);pointer-events:none}
  .room .hud h2{font-size:clamp(3.2rem,6.6vw,5.6rem)}
  .room .hud .label{color:#fff;background:rgba(9,14,18,.66);padding:.2rem .6rem;border-radius:3px;align-self:flex-start;text-shadow:none}
  .room .hud .row .label{align-self:center}
  .room .hud .lead{max-width:42rem}
  .room .hud .btn{pointer-events:auto;text-shadow:none}
  .room .hud .tip{color:#fff}
  .tobench{display:inline-block}
  .benchbar{display:flex}
  .room .notebox{position:absolute;z-index:4;top:1rem;inset-inline-start:max(24px,calc(50vw - 35rem));max-width:38rem;box-shadow:0 14px 40px rgba(0,0,0,.6)}
  .room .bench{display:none}
  .room.solving .bench{display:flex;position:absolute;inset:0;z-index:5;padding:.75rem max(24px,calc(50vw - 35rem));gap:.6rem;justify-content:center;overflow:auto;animation:rise .45s ease}
  .room .bench .panel{background:rgba(11,17,22,.84);backdrop-filter:blur(6px);padding:1rem 1.15rem;gap:.7rem}
  .room .bench .cols{align-items:center;gap:1rem}
  .room .bench .cols>.stack:last-child{position:static}
  .room .bench .stack{gap:.7rem}
  .room .bench .fig{max-width:min(27rem,calc(100dvh - 20rem))}
  .room .bench .fig.wide{max-width:min(31rem,calc((100dvh - 30rem) * 1.33))}
  .room .bench .face{max-width:min(23rem,calc((100dvh - 26rem) * 1.78))}
  .room .bench .cards{max-width:min(34rem,calc((100dvh - 15rem) * .95));margin-inline:auto}
  .room .bench .pcard .cap{font-size:.88rem;padding:.4rem .6rem}
  .room .bench .tok img{width:3.2rem;height:3.2rem}
  .room .win{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,rgba(9,14,18,.55),rgba(9,14,18,0) 70%)}
  .room .win .panel{max-width:36rem;background:rgba(11,17,22,.86);backdrop-filter:blur(6px);text-align:center;align-items:center;padding:2rem}
  .room .win .tile{width:5rem;height:5rem;font-size:3rem}
  .room .win h3{font-size:1.8rem}
}
.room.done .hud .lead,.room.done .hud .tip{display:none}
@media (min-width:1000px) and (min-height:620px){
  .room.solving .world{filter:blur(10px) brightness(.28)}
  .room .bench .panel{background:transparent;border:0;backdrop-filter:none;padding:0;box-shadow:none}
  .room .bench .panel>.label{color:var(--amber);font-size:1.05rem}
  .room .bench .panel>p{font-size:1.12rem;text-shadow:0 2px 12px #000;max-width:32rem}
  .room .bench{justify-content:center;padding-top:3.6rem}
  .room .bench .cols{align-items:start;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem 4rem;max-width:66rem;margin-inline:auto;width:100%}
  .room .bench .fig{max-width:min(30rem,calc(100dvh - 17rem));margin-inline:0}
  .room .bench .fig.wide{max-width:min(33rem,calc((100dvh - 27rem) * 1.33))}
  .room .bench .face{max-width:min(26rem,calc((100dvh - 24rem) * 1.78));margin-inline:0}
  .room .bench .dialpad{max-width:min(26rem,calc((100dvh - 24rem) * 1.78));margin-inline:0}
  .room .bench .keys{justify-content:flex-start}
  .room .bench .cards{margin-inline:0}
  .room .bench .hintp{border-top:1px solid rgba(255,255,255,.18);padding-top:.7rem}
  .room .benchbar{position:absolute;top:.8rem;inset-inline-start:max(24px,calc(50vw - 35rem));z-index:2}
  .room.done .hud{display:none}

function elapsed(){if(!S.startAt)return 0;return Math.floor(((S.endAt||Date.now())-S.startAt)/1000);}
function clock(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function left(){return GAME.minutes*60-elapsed();}
function letters(){const l=[];GAME.rooms.forEach((r,i)=>{if(i<3&&S.solved[i])l.push(r.letter);});if(S.matchOk)l.push(GAME.rooms[3].letter);return l;}

function vRoom(){const fresh7=wonAt&&Date.now()-wonAt<7000,fresh1=wonAt&&Date.now()-wonAt<1200;const i=S.room,r=GAME.rooms[i],n=GAME.rooms.length,done=S.solved[i],sp=S.open!=null&&!done?r.spots[S.open]:null,h=S.hints[i],solving=S.view==='solve'&&!done;

  <section class="panel hintp" aria-labelledby="hn"><div class="row"><h3 id="hn" class="label" style="margin-inline-end:auto">רמזים</h3><span class="lamps" role="img" aria-label="${h} מתוך ${r.hints.length} רמזים נפתחו">${r.hints.map((_,k)=>`<i class="${k<h?'on':''}"></i>`).join('')}</span>
  ${h<r.hints.length?`<button class="btn ghost small" data-act="hint" data-fid="hint">${h?'רמז נוסף':'בקשו רמז'}</button>`:''}</div>
  ${h?`<ol class="hints" aria-live="polite">${r.hints.slice(0,h).map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:''}</section></div></div></div>`}
  </section>`;}
function vEnd(){const e=GAME.ending,sec=elapsed(),hints=S.hints.reduce((a,b)=>a+b,0),inTime=sec<=GAME.minutes*60;
  return `<section>
  ${frame(Object.assign({fb:'end'},e),SCENES.end,`<p class="label">המשימה הושלמה</p><h2 tabindex="-1" id="top">${esc(e.title)}</h2>`,'','cover')}
  <div class="panel">${e.text.map((t,i)=>`<p ${i?'':'class="lead"'}>${esc(t)}</p>`).join('')}</div>
  <dl class="specs three"><div><dt>הזמן שלכם</dt><dd class="big">${clock(sec)}</dd><dd class="dim">${inTime?'בתוך הזמן שהוקצב':'מעבר לזמן שהוקצב'}</dd></div>
  <div><dt>רמזים שנעזרתם בהם</dt><dd class="big">${hints}</dd></div><div><dt>מילת הקוד</dt><dd class="big" style="font-family:var(--sans);font-weight:800;direction:rtl">ערפל</dd></div></dl>
  <div class="panel"><h2 class="label">מה למדנו</h2><ul class="list">${e.learned.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <p class="dim">${esc(e.credits)}</p><div class="row"><button class="btn ghost" data-act="askreset" data-fid="reset">שחקו שוב</button></div></section>`;}
function sameNode(o,n){if(o.nodeType!==n.nodeType)return false;if(o.nodeType!==1)return true;if(o.tagName!==n.tagName)return false;
  if((o.getAttribute('data-fid')||'')!==(n.getAttribute('data-fid')||''))return false;
  if(o.tagName==='VIDEO'&&o.getAttribute('src')!==n.getAttribute('src'))return false;return true;}
function syncAttrs(o,n){for(const a of [...o.attributes])if(!n.hasAttribute(a.name))o.removeAttribute(a.name);for(const a of [...n.attributes])if(o.getAttribute(a.name)!==a.value)o.setAttribute(a.name,a.value);}
function syncKids(o,n){const oc=[...o.childNodes],nc=[...n.childNodes];
  for(let i=0;i<nc.length;i++){const a=oc[i],b=nc[i];
    if(!a){o.appendChild(b);continue;}
    if(!sameNode(a,b)){o.replaceChild(b,a);continue;}
    if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;continue;}
    syncAttrs(a,b);if(a.tagName!=='VIDEO'&&a.tagName!=='IMG')syncKids(a,b);}
  for(let i=oc.length-1;i>=nc.length;i--)o.removeChild(oc[i]);}
function morph(root,html){const t=document.createElement('template');t.innerHTML=html;syncKids(root,t.content);}
function render(focusTop){const fid=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fid:null;
  bar();morph($('#app'),{open:vOpen,story:vStory,room:vRoom,end:vEnd}[S.screen]());save();
  const v=$('#app video');if(v&&v.paused&&!v.ended){const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});}
  if(focusTop){const t=$('#top');if(t){t.focus({preventScroll:true});window.scrollTo(0,0);}}
  else if(fid&&(document.activeElement===document.body||!document.activeElement)){const el=document.querySelector(`[data-fid="${fid}"]`);let t=el&&el.disabled?el.parentElement.querySelector('button:not([disabled])'):el;if(!t)t=document.querySelector('.key.letter')||document.querySelector('[data-fid="try"]')||document.querySelector('[data-fid="next"]')||$('#top');if(t)t.focus({preventScroll:true});}}
function say(t){$('#live').textContent=t;}
function modal(html){$('#modal').innerHTML=html?`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="panel gold">${html}</div></div>`:'';document.querySelector('.wrap').inert=!!html;if(html){const b=$('#modal [data-act=closemodal]')||$('#modal button');if(b)b.focus();}}

/* ---- actions ---- */
function checkLock(){const r=GAME.rooms[S.room],L=r.lock;let ok=false;
  if(L.type==='digits')ok=S.digits.join('')===L.answer;
  if(L.type==='colors')ok=S.colors.join()===L.answer.join();
  if(L.type==='arrows')ok=[0,1,2,3].map(k=>S.arrows[k]||'').join()===L.answer.join();
  if(L.type==='word')ok=S.matchOk&&S.word.join('')===L.answer;
  if(ok){S.solved[S.room]=true;S.fb=null;S.open=null;if(S.room===GAME.rooms.length-1&&!S.endAt)S.endAt=Date.now();sfx.win();say('המנעול נפתח. '+r.win.h);wonAt=Date.now();render(true);}
  else{const msg={digits:'המנעול לא נפתח. עקבו שוב אחרי כל תעלה עד הפתח שלה.',colors:'המנעול לא נפתח. בדקו שוב את סדר התמונות.',arrows:'המנעול לא נפתח. לאן נודדת טיפה על חרוט?',word:S.matchOk?'זו לא המילה. קראו שוב את החידה שעל הדלת.':'עדיין חסרה אות. השלימו קודם את התכנון.'}[L.type];
    S.fb={k:'lock',c:'bad',t:msg};say(msg);if(L.type==='colors')S.colors=[];if(L.type==='arrows')S.arrows=[null,null,null,null];if(L.type==='word')S.word=[];sfx.bad();render();}}
const ACT={
  sound(){S.sound=!S.sound;if(S.sound)sfx.click();render();},
  big(){S.big=!S.big;render();},
  tostory(){if(S.screen!=='open')return;S.screen='story';sfx.click();render(true);},
  voice(){if(S.screen!=='story')return;if(voiceEl)stopVoice();else playVoice(GAME.story.voice||[]);render();},
  start(){if(S.screen!=='story')return;stopVoice();S.view='explore';S.screen='room';S.room=0;S.startAt=Date.now();S.order=GAME.rooms[1].puzzle.start.slice();sfx.drop();render(true);chapter(0);},
  spot(a){const k=+a;if(S.screen!=='room'||!GAME.rooms[S.room].spots[k])return;S.open=S.open===k?null:k;S.seen[S.room+'-'+k]=1;sfx.drop();render();if(S.open!=null){const sp=GAME.rooms[S.room].spots[k];say(sp.t+'. '+sp.d);}},
  dig(a){const [k,d]=a.split(',').map(Number);if(S.screen!=='room'||S.room!==0||S.solved[0]||!(k>=0&&k<3)||Math.abs(d)!==1)return;S.digits[k]=(S.digits[k]+d+10)%10;S.fb=null;sfx.click();render();say(`פתח ${k+1}: ${S.digits[k]}`);},
  mv(a){const [k,d]=a.split(',').map(Number),j=k+d;if(j<0||j>=S.order.length)return;[S.order[k],S.order[j]]=[S.order[j],S.order[k]];sfx.click();render();},
  col(a){if(S.screen!=='room'||S.room!==1||S.solved[1]||!COLORS[a])return;const i=S.colors.indexOf(a);if(i>=0)S.colors.splice(i,1);else if(S.colors.length<4)S.colors.push(a);else return;S.fb=null;sfx.click();render();},
  sp(a){const [ks,d]=String(a).split(','),k=+ks,sn=SPN[k];if(S.screen!=='room'||S.room!==2||S.solved[2]||!sn||(d!==sn.tip&&d!==OPP[sn.tip]))return;S.arrows[k]=S.arrows[k]===d?null:d;S.fb=null;sfx.drop();render();say(S.arrows[k]?`קוץ ${k+1}: ${ARROWS[d][0]}`:`קוץ ${k+1}: בוטל`);},
  ltr(a){if(S.word.length>=4)return;const have=letters(),n=have.filter(x=>x===a).length,u=S.word.filter(x=>x===a).length;if(u>=n)return;S.word.push(a);S.fb=null;sfx.click();render();},
  clr(a){if(['colors','arrows','word'].includes(a)){S[a]=a==='arrows'?[null,null,null,null]:[];S.fb=null;sfx.click();render();}},
  solve(){if(S.screen!=='room'||S.solved[S.room])return;S.view='solve';S.open=null;sfx.drop();render();const b=document.querySelector('[data-fid="explore"]');if(b&&b.offsetParent)b.focus({preventScroll:true});},
  explore(){if(S.screen!=='room')return;S.view='explore';sfx.click();render();const b=document.querySelector('[data-fid="solve"]');if(b&&b.offsetParent)b.focus({preventScroll:true});},
  tok(a){const P=GAME.rooms[3].puzzle;if(S.screen!=='room'||S.room!==3||S.matchOk||!P.rows.some(r=>r.id===a))return;S.tok=S.tok===a?null:a;S.fb=null;sfx.click();render();},
  part(a){const P=GAME.rooms[3].puzzle;if(S.screen!=='room'||S.room!==3||S.matchOk||!P.opts.some(o=>o[0]===a))return;
    if(!S.tok){S.fb={k:'match',c:'bad',t:'בחרו קודם יצור, ואז לחצו על חלק בשרטוט.'};say(S.fb.t);render();return;}
    P.rows.forEach(r=>{if(S.match[r.id]===a)delete S.match[r.id];});S.match[S.tok]=a;S.tok=null;S.fb=null;sfx.drop();
    if(P.rows.every(r=>S.match[r.id])){const good=P.rows.filter(r=>S.match[r.id]===r.a).length;if(good===P.rows.length){S.matchOk=true;sfx.win();say(P.done);}else{S.fb={k:'match',c:'bad',t:`${good} מתוך ${P.rows.length} במקום הנכון. בחרו יצור והעבירו אותו לחלק אחר.`};say(S.fb.t);sfx.bad();}}render();},
  chk(){const P=GAME.rooms[3].puzzle;if(S.room!==3||S.matchOk)return;const good=P.rows.filter(r=>S.match[r.id]===r.a).length;
    if(good===P.rows.length){S.matchOk=true;S.fb=null;sfx.win();say(P.done);}else{S.fb={k:'match',c:'bad',t:`${good} מתוך ${P.rows.length} התאמות נכונות. נסו שוב.`};sfx.bad();}render();},
  try(){if(S.screen==='room'&&!S.solved[S.room])checkLock();},
  hint(){const r=GAME.rooms[S.room];if(S.screen==='room'&&!S.solved[S.room]&&S.hints[S.room]<r.hints.length){S.hints[S.room]++;sfx.drop();render();}},
  next(){if(S.screen!=='room'||!S.solved[S.room])return;S.view='explore';S.open=null;S.fb=null;let ch=-1;if(S.room<GAME.rooms.length-1){S.room++;ch=S.room;sfx.click();}else{S.screen='end';sfx.end();}render(true);if(ch>=0)chapter(ch);},
  askreset(){opener=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.act:null;modal(`<h2 id="mh" style="font-size:2.4rem">להתחיל מחדש?</h2><p>ההתקדמות, האותיות והשעון יימחקו.</p><div class="row"><button class="btn ghost" data-act="closemodal">ביטול</button><button class="btn" data-act="reset">כן, מההתחלה</button></div>`);},
  closemodal(){modal('');const b=document.querySelector('#app [data-act="askreset"]')||document.querySelector('[data-fid="reset"]');if(b)b.focus();},
  motion(){S.still=!S.still;render();},
  reset(){const keep={sound:S.sound,big:S.big,still:S.still};S=Object.assign(fresh(),keep);stopVoice();modal('');render(true);}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){f(b.dataset.arg);syncMusic();}});
document.addEventListener('change',e=>{const s=e.target.closest('select[data-row]');if(s&&!S.matchOk&&S.screen==='room'&&S.room===3){S.match[s.dataset.row]=s.value;S.fb=null;save();}});
document.addEventListener('error',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.fb&&SCENES[el.dataset.fb]){const alt=el.getAttribute('alt')||el.getAttribute('aria-label')||'';el.outerHTML=SCENES[el.dataset.fb](alt);}},true);
window.addEventListener('storage',e=>{if(e.key===GAME.key&&e.newValue){S=load();if(!S.order)S.order=GAME.rooms[1].puzzle.start.slice();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').innerHTML&&S.screen==='room'&&S.view==='solve'){ACT.explore();return;}if(!$('#modal').innerHTML)return;if(e.key==='Escape')ACT.closemodal();
  if(e.key==='Tab'){const b=[...document.querySelectorAll('#modal button')],i=b.indexOf(document.activeElement);e.preventDefault();b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus();}});
setInterval(()=>{const c=$('#clock');if(!c)return;const l=left();c.textContent=clock(l);const tb=$('#tbar');if(tb)tb.style.width=Math.max(0,l/(GAME.minutes*60)*100)+'%';c.parentElement.classList.toggle('late',l<=0);if(l<=0&&!lateShown&&S.screen==='room'&&!S.endAt){lateShown=true;render();}if(l>0)lateShown=false;},1000);

S=load();if(!S.order)S.order=GAME.rooms[1].puzzle.start.slice();
(function(){let done=false;const show=()=>{if(!done){done=true;document.body.classList.add('ready');}};setTimeout(show,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(show);})();
try{render();}catch(e){S=fresh();S.order=GAME.rooms[1].puzzle.start.slice();render();}
</script>
